# Deliberately not a workspace member: this is a copyable downstream project.
[workspace]

[package]
name = "downstream-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[features]
layout = ["slint-node-editor/layout"]

[dependencies]
slint = { version = "1.18.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software"] }
slint-node-editor = "1.0.0"

[build-dependencies]
# Required on the consumer side too: it turns on the compiler's
# `experimental-library-module` support, which resolves `@nodeeditor`.
slint-build = { version = "1.18.0", features = ["experimental-module-builds"] }

[dev-dependencies]
i-slint-backend-testing = { version = "1.18.0" }
