[package]
name = "slint-node-editor"
version = "0.1.0"
links = "nodeeditor"
edition = "2021"
authors = ["Till Adam <till.adam@kdab.com>"]
license = "MIT OR Apache-2.0"
description = "A flexible, generic Slint component library for building visual graph editors"
repository = "https://github.com/slint-ui/slint"
homepage = "https://slint.dev"
documentation = "https://docs.rs/slint-node-editor"
keywords = ["gui", "node-editor", "graph", "slint", "visual-programming"]
categories = ["gui", "visualization"]
readme = "README.md"
rust-version = "1.92"
include = [
    "src/**/*",
    "/*.slint",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2", default-features = false, features = ["std", "compat-1-2"] }
rust-sugiyama = { version = "0.4", optional = true }

[features]
layout = ["rust-sugiyama"]

[dev-dependencies]
i-slint-backend-testing = { workspace = true }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2", features = ["experimental-module-builds"] }

[workspace]
members = [
    "examples/advanced",
    "examples/minimal",
    "examples/custom-shapes",
    "examples/animated-links",
    "examples/pin-compatibility",
    "examples/zoom-stress-test",
    "examples/sugiyama",
    "examples/sugiyama-stress-test",
    "examples/edge-fade",
]

[workspace.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia"] }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2" }
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", rev = "2bb5a20694e75d2e8d50cbea91595f8ebff0d9a2" }
slint-node-editor = { path = "." }
