name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # The check `cargo publish --dry-run` cannot do: a dry-run compiles only the
    # Rust library and never parses a .slint file, so a broken component or an
    # unresolvable library name passes it. `included` builds an out-of-workspace
    # consumer against exactly the files `include` would ship.
    - name: Downstream smoke test
      run: ./smoke/run.sh included
